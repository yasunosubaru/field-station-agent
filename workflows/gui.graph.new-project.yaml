id: gui.graph.newproject
version: 3
title: 从 SBF/CSV 新建 Graph 工程（独立进程；CDP 走 9224）
summary: >
  Graph 不是套件里的一个页面，而是**独立的 Electron 进程**：套件首页的 Graph 卡片
  （div#Graph-welcome.application-container.GraphApp.standAloneApp）点下去会启动
  C:\Program Files\NovAtel Inc\NovAtel Application Suite\Graph\Graph.exe。

  **2026-11-04 更正**：之前记的"CDP 到不了 Graph"是误判——当时用的是 payload 里那份副本
  （缺 jszip，主进程启动即崩）。用系统安装的那份加 --remote-debugging-port=9224，
  CDP 正常（1 个页面），点击引擎在其页面实测到 14 个可点目标，含 New Project / Open Project。

  **前置条件**：Graph 必须先带调试端口启动（套件卡片启动的实例不带端口，流程会明确报
  environment 失败）：
      "C:\Program Files\NovAtel Inc\NovAtel Application Suite\Graph\Graph.exe" --remote-debugging-port=9224

  真实路径（来自 Graph 自己的 i18n 与实测）：Welcome → New Project → Project Wizard →
  Project Information（Project Folder * Select、Project Name *、Project Description）→
  Next → Receiver Data（Select → 原生 Open 对话框）→ Next → File Validation（Copy / Finish）→
  Pre-Process（Map / Timeline / Flags）→ Plot。写盘发生在 Plot，所以闸门放在 Plot 前。
intent: graph.newproject
risk: medium
tags: [graph, gui, wizard, independent-process]

requires:
  engine: true
  live: false
  gui: true
  node: false

params:
  source:
    type: path
    required: true
    description: >
      NovAtel 接收机数据文件（.gps / .sbf / .csv 都行，Graph 的 Receiver Data 就是这么选的）；
      流程只读它并算哈希
  project_name:
    type: string
    required: true
    pattern: '^[A-Za-z0-9 _.-]+$'
    description: Graph 的 Project Name（不含路径分隔符）
  project_dir:
    type: path
    required: true
    description: Graph 的 Project Folder；Project Wizard 里用 Select 选中的那个目录
  station:
    type: string
    required: false
    # 注意：Graph 的 Project Description 是**必填**，而这个参数原本声明为可选，
    # 于是调度方不传时 resolve 返回 None、被 str(None) 写成字面量 'None'，
    # Graph 因此判定"没填"、Next 永久禁用、Select 点了没反应。实测踩过
    # （2026-11-18），白查了好几轮。
    # 这里给一个字面默认值（不能用 ${params.project_name}：resolve_params 阶段
    # params 还没定完，模板解析不到）。保证 Description 永远非空。
    default: 'Field station project'
    description: 台站名（写进工程描述；不传则用默认文案）
  start_utc:
    type: string
    required: false
    description: 开始时间（ISO 8601，可选；留空用文件第一历元）
  end_utc:
    type: string
    required: false
    description: 结束时间（ISO 8601，可选）

approval:
  required: false
  risk: medium
  reason: 真正的写盘在 Plot 之前由 human_gate 停一次；前面的向导步骤只读或可撤。

failure:
  screenshot: true
  classes: [environment, input, execution, policy, selector_drift, dialog_unavailable, gate_timeout, hardware_missing]

docs:
  - 逆向/03_分析/19_原版GUI覆盖矩阵.md
  - 逆向/03_分析/18_1比1差距台账.md
  - docs/operations/rpa-completion.md

steps:
  - id: health
    kind: http
    method: GET
    path: /api/health
    expect:
      json:
        ok: true

  - id: home
    kind: restore_home
    description: >-
      清残留弹窗/对话框并回到 My Applications。放在任何界面动作之前：
      rpa-completion.md §5.6 记录过「上一条流程没关弹窗挡住下一条」的事故。
    timeout_s: 20

  - id: display
    kind: ensure_display
    description: >-
      校验当前显示模式。几何三层（虚拟屏/视口/保活）任何一层失效都会让后面的
      坐标失去意义；在这里提前变成明确的 environment 错误，而不是表现成「点不中」。
    width: 1920
    height: 1080
    refresh: 60
    allow_mismatch: false

  - id: digest
    kind: file_digest
    path: ${params.source}
    save_as: source
    description: 先钉住输入文件的哈希，事后能证明工程是从哪一份数据建的

  - id: attach_graph
    kind: wait_ui
    port: 9224
    control: New Project
    expect:
      contains: New Project
    timeout: 20
    description: >
      等 Graph 的窗口出现。它必须是以 --remote-debugging-port=9224 启动的那个实例；
      套件卡片拉起来的实例没有调试端口，这里会明确报 environment（不是"找不到按钮"）
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有 9224 就说明 Graph 启动方式不对。

  - id: open_wizard
    kind: gui
    port: 9224
    description: Welcome 窗口点 New Project，Project Wizard 第一步是介绍页
    actions:
      - action: click
        locator: "target:New Project"
    screenshot: true

  - id: wait_wizard
    kind: wait_ui
    port: 9224
    control: Project Wizard
    expect:
      contains: Project Wizard
    timeout: 10

  - id: goto_information
    kind: gui
    port: 9224
    description: 介绍页点 Next，进 Project Information
    actions:
      - action: click
        locator: "target:Next"
    screenshot: true

  - id: wait_information
    kind: wait_ui
    port: 9224
    control: Project Folder
    expect:
      contains: Project Folder
    timeout: 10

  - id: fill_information
    kind: gui
    port: 9224
    description: >
      填 Project Name 与 Project Description。Project Folder 不在这里填——它是
      「Select」按钮开的原生 Select Folder 对话框，下一步人工选
    actions:
      - action: type
        locator: project-name-input
        value: ${params.project_name}
      - action: type
        locator: project-desc-input
        value: ${params.station}
    screenshot: true

  - id: choose_folder
    # 全自动：用 agent-desktop 的 accessibility ref + --headed 物理输入操作
    # 原生「选择文件夹」对话框。实测（2026-11-24）纯 CDP 路径都不弹：
    #   JS click / dispatchMouseEvent -> Electron 手势/模态问题，不弹
    #   真鼠标 SetCursorPos -> window.screenX=0,0 点错窗口
    # agent-desktop 能看到 Electron 网页内容和原生对话框，按 ref 定位不靠坐标，
    # --headed 发物理输入提供真实手势。 AttachThreadInput 绕过 Windows 前台锁定。
    # 源码级依据见 逆向/03_分析/Graph逆向-2026-11-23.md §3。
    kind: select_folder
    app: Graph
    project_dir: ${params.project_dir}
    timeout_s: 25
    screenshot: true

  - id: next_receiver
    kind: gui
    port: 9224
    description: 目录选好后点 Next，进 Receiver Data
    actions:
      - action: click
        locator: "target:Next"
    screenshot: true

  - id: wait_receiver
    kind: wait_ui
    port: 9224
    control: NovAtel Receiver Data File
    expect:
      contains: NovAtel Receiver Data File
    timeout: 10

  - id: choose_file
    # 全自动：agent-desktop 操作原生「打开」对话框（与 choose_folder 同构）。
    kind: select_file
    app: Graph
    file: ${params.source}
    timeout_s: 25
    screenshot: true

  - id: next_validate
    kind: gui
    port: 9224
    description: 文件选好后点 Next，进 File Validation
    actions:
      - action: click
        locator: "target:Next"
    screenshot: true

  - id: wait_validation
    kind: wait_ui
    port: 9224
    control: File Validation
    expect:
      contains: File Validation
    timeout: 20

  - id: approve_plot
    kind: human_gate
    risk: medium
    reason: >
      Plot 会把处理结果写进工程目录（不可逆），所以在这之前停一次。
    prompt: |
      确认 File Validation 通过后，点「Finish」进 Pre-Process，核对 Map / Timeline / Flags
      （时间范围按 params.start_utc ~ params.end_utc）。到这里**先不要**点 Plot。
      确认无误后选 approved，下一步才是 Plot。

  - id: plot
    kind: gui
    port: 9224
    description: 点 Pre-Process 窗口的 Plot 开始处理（写盘已在上一道闸门批准）
    actions:
      - action: click
        locator: "target:Plot"
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        现在点 Pre-Process 窗口的「Plot」，等处理完成、Processed 窗口出现。
        完成后选 done；报错就选 failed 并照抄错误文字。

  - id: record
    kind: artifact
    name: graph-project.json
    content:
      job: ${job.id}
      project: ${params.project_name}
      project_dir: ${params.project_dir}
      source: ${steps.digest}
      station: ${params.station}
      start_utc: ${params.start_utc}
      end_utc: ${params.end_utc}
      driver_note: >
        Graph 是独立 Electron 进程，走 CDP 9224；两个原生对话框（Select Folder / Open）
        仍由人工完成，其余向导步骤自动。
