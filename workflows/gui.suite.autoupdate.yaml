id: gui.suite.autoupdate
version: 3
title: 读取套件「检查更新」的真实结果（只读，不下载不安装）
summary: >
  本版套件（实测 2.11.0）的设置菜单只有四项：标题 Settings、Check For Updates、
  标题 Theme（Light / Dark）、Quit——**没有**「自动更新」开关或页面。点 Check For Updates
  会联网查一次并弹窗：「NovAtel Application Suite Update / NovAtel Application Suite is
  up to date / Current Version: 2.11.0 / Close」。齿轮本身是纯图标
  （a#settings-banner），用 CSS 选择器定位后 CDP 点得到（实测），结果也由 CDP 回读；
  等弹窗改成条件等待（wait_ui），不再睡固定秒数。仓库仍然不做自动更新：更新源是 AWS，
  没人值守时也无法回滚，需要升级就走 gui.app.update（人工闸门）。
intent: suite.autoupdate.inspect
risk: low
tags: [suite, autoupdate, gui, read-only]

requires:
  engine: true
  live: false
  gui: true
  node: false

params:
  expect_version:
    type: string
    required: false
    pattern: '^[0-9]+(\.[0-9]+)+$'
    description: 可选：断言弹窗里 Current Version 的版本号（例如 2.11.0）；不给就只记录

approval:
  required: false
  risk: low
  reason: 只查一次更新并读弹窗文字，不下载、不安装、不改设置。

failure:
  screenshot: true
  # 八类错误分类 + 两条历史类别（artifact/capability 仍由引擎层与闸门路径产生）
  classes: [environment, input, execution, policy, selector_drift, dialog_unavailable, gate_timeout, hardware_missing, artifact, capability]

docs:
  - 逆向/03_分析/19_原版GUI覆盖矩阵.md
  - docs/operations/high-risk-actions.md

steps:
  - id: health
    kind: http
    method: GET
    path: /api/health
    expect:
      json:
        ok: true

  - id: dismiss_stale
    kind: gui
    description: >
      上一次运行若失败在 wait_popup/read_result，更新弹窗会留在屏上。弹窗在时整页有
      一层遮罩，点齿轮和 Check For Updates 都会落在遮罩上（实测），于是 wait_popup
      读到的是**上一次**的结果——看起来成功，其实这次根本没查。所以先「有就关掉」：
      没有弹窗时这是空操作（click_optional），不算失败、也不留 warning。
    actions:
      - action: click_optional
        locator: "target:Close"
    screenshot: false
    assisted:
      enabled: true
      prompt: |
        如果屏幕上还开着「NovAtel Application Suite Update」弹窗，点它的 Close 关掉；
        没有弹窗就直接选 done。关掉后选 done。

  - id: ensure_closed
    kind: wait_ui
    description: >
      确认弹窗真的不在了再开始查。读不到弹窗正文（控制名是仓库里已有的那一整段弹窗文字）
      才算满足；如果 dismiss_stale 没关掉（例如弹窗在“Checking”态换了按钮），
      这一步会以 gate_timeout 停下，而不是继续读旧结果。
    control: NovatEl Application Suite Update Novat
    expect:
      absent: true
    timeout: 5
    assisted:
      enabled: true
      prompt: 确认屏幕上已经**没有**「NovAtel Application Suite Update」弹窗，然后选 done。

  - id: open_check
    kind: gui
    description: >
      点右上角齿轮（a#settings-banner，纯图标无文字，用 CSS 选择器定位），
      再点菜单里的 Check For Updates（target: 按"人眼看到的目标"点，真实鼠标事件）。
      只检查，不点任何 Install。
    actions:
      - action: click
        locator: "css:#settings-banner"
      - action: click
        locator: "target:Check For Updates"
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        请点套件右上角的齿轮图标，在菜单里选「Check For Updates」。
        菜单里应当只有：Settings / Check For Updates / Theme（Light、Dark）/ Quit。
        只做检查，**不要**在任何「新版本可用」的横幅上点 Install。
        完成后选 done。

  - id: wait_popup
    kind: wait_ui
    description: >
      条件等待，不睡固定时长：每 200ms 读一次弹窗正文，读到带版本号的
      「Current Version: x.y.z」就继续，超时才失败。控制名沿用仓库里已有的整段弹窗文字，
      因为 CDP 的 `read` 只在**可见**元素里找文字：弹窗关着时读到的是「找不到」
      （正好当作「还没到时候」），而 css:div.update-software-popup 那种节点会一直留在
      DOM 里、关掉后也带旧文字，按它读会在弹窗没出现时就把上一次的结果当成本次结果。
      套件要联网查一次（本机实测 2~4 秒），给 15 秒预算。
    control: NovatEl Application Suite Update Novat
    expect:
      matches: 'Current Version: [0-9]+(\.[0-9]+)+'
    timeout: 15
    assisted:
      enabled: true
      prompt: |
        请等套件的更新结果弹窗出现（标题 NovAtel Application Suite Update，
        正文有 “Current Version: x.y.z”），确认后再选 done。
        如果 15 秒内没出现，选 failed 并写明看到的状态（是否有进度条/报错）。

  - id: read_result
    kind: verify_ui
    description: >
      读整个更新弹窗（div.update-software-popup）的正文：它同时含结论行
      （“… is up to date”或“新版本可用”）与「Current Version: x.y.z」。
      这里断言版本行存在，具体文字原样进证据
    control: NovatEl Application Suite Update Novat
    expect:
      matches: 'Current Version: [0-9]+(\.[0-9]+)+'
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: close_popup
    kind: gui
    description: >
      读完后把更新弹窗关掉。不关会挡住后续流程（实测：弹窗在，Manage 卡片的点击会落在遮罩上，
      下一个流程第一步就失败）。这一步不改变任何状态，只是收尾
    actions:
      - action: click
        locator: "target:Close"
    screenshot: false

  - id: assert_version
    kind: assert
    description: 只有给了 expect_version 才断言
    checks:
      - path: steps.read_result.value
        contains: ${params.expect_version}

  - id: record
    kind: artifact
    name: autoupdate-setting.json
    content:
      job: ${job.id}
      dialog: ${steps.read_result}
      expect_version: ${params.expect_version}
      decision: >
        不做自动更新：更新源是 AWS，本机没有可信的离线更新包，
        也没有无人值守时的回滚能力。需要升级时走 gui.app.update（人工闸门）。
