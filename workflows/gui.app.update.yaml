id: gui.app.update
version: 2
title: 更新已安装的非核心应用（Update application，更新前人工闸门）
summary: >
  本版套件没有「给某个应用选一个新 zip」的更新入口：更新由首页顶部横幅发起——
  有更新时按钮写着「New noncore app version available」（另一种文案是
  “Updates are available for N Applications”，按钮 Install / Dismiss），点开是
  Update application 弹窗，正文 “Select the application(s) to update” + 应用卡片，
  选中后才会出现可用的更新按钮。没有可用更新时这些元素根本不在 DOM 里
  （本机实测整页找不到 “Update application” 一个节点，横幅也不可见，仍写着
  “Updates are available for 0 Applications”）。更新源是 AWS（文案
  “Unable to fetch updates from AWS. Please try again later.”），所以打开弹窗这一步
  只能人工完成；本流程停在点 Update 之前。
intent: suite.app.update
risk: high
tags: [suite, application, update, gui, aws]

requires:
  engine: true
  live: false
  gui: true
  node: false

params:
  application:
    type: string
    required: true
    description: 要更新的应用名称（必须已安装；弹窗里卡片的标题就是这个字）
  expect_version:
    type: string
    required: false
    description: 更新后应显示的版本号

approval:
  required: false
  risk: high
  reason: 审批门放在点 Update 之前；打开弹窗与核对卡片只读。

failure:
  screenshot: true
  classes: [environment, input, execution, artifact, capability]

docs:
  - 逆向/03_分析/19_原版GUI覆盖矩阵.md
  - docs/operations/high-risk-actions.md

steps:
  - id: health
    kind: http
    method: GET
    path: /api/health
    expect:
      json:
        ok: true

  - id: home
    kind: restore_home
    description: >-
      清残留弹窗/对话框并回到 My Applications。放在任何界面动作之前：
      rpa-completion.md §5.6 记录过「上一条流程没关弹窗挡住下一条」的事故。
    timeout_s: 20

  - id: display
    kind: ensure_display
    description: >-
      校验当前显示模式。几何三层（虚拟屏/视口/保活）任何一层失效都会让后面的
      坐标失去意义；在这里提前变成明确的 environment 错误，而不是表现成「点不中」。
    width: 1920
    height: 1080
    refresh: 60
    allow_mismatch: false

  - id: open_popup
    kind: human_gate
    risk: medium
    reason: >
      Update application 弹窗只能从首页顶部那张**条件性**横幅打开，而横幅是否出现
      取决于真实数据：比较本机已装版本与远端最新版本，只有前者更旧时才显示。
      「点横幅」本身是网页元素、CDP 能点；但**有没有横幅**不是流程能控制的，
      所以这一步留闸门，让人确认「场景确实成立、弹窗确实打开了」，
      避免流程在后面把「弹窗没出现」误报成「选择器坏了」。
    prompt: |
      请先确认更新横幅是否存在，再决定：

      · 场景成立的判据（可用 `python tools/probe_update_banner.py` 直接查）：
        `Updates are available for N Applications` 且 N ≥ 1，
        且 `.noncore-app-update-banner` 的 display 是 block。
      · 本机造场景的办法（已核实）：远端最新版本可从
        `…/stageNonCoreAppDetails/fnNonCoreAppDetails?IsDev=F` 取到（实测
        perceptionViewer=0.2.0 / manage2=2.2.0）；把
        `%APPDATA%\NovAtelApplicationSuite\userSettings.json` 里
        `app.addedAppDetails.<app>.version` 改成更低的合法三段式（如 0.1.0），
        重启套件即可。改前备份那个 json。

      场景成立时：点首页顶部的横幅按钮「New noncore app version available」
      打开 Update application 弹窗，确认弹窗里出现了 params.application
      对应的应用卡片，然后选 approved。

      场景不成立（N = 0、横幅不可见）时：选 rejected，并在备注里写
      「本机无可用更新」—— 不要假装打开过。

  - id: verify_popup
    kind: verify_ui
    description: >
      弹窗正文的真实文案是 “Select the application(s) to update”；
      读不到就说明没有更新弹窗（没有场景时本机就是这样）
    control: Select the application(s) to update
    expect:
      contains: Select the application(s) to update
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: approve_update
    kind: human_gate
    risk: high
    reason: 覆盖安装不可逆；先确认应用名与要装的版本。
    prompt: |
      即将更新应用。应用名与期望版本见本 job 的 params（application / expect_version），
      确认弹窗里选中的就是它、版本正确后再批准。

  - id: update
    kind: gui
    description: 点弹窗右下角的更新按钮（未选中卡片时是禁用态）；target: 按目标点，闸门已在前面
    actions:
      - action: click
        locator: "target:Update"
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        现在点 Update，等进度结束。完成后选 done；失败就选 failed 并写明错误
        （例如 “Unable to fetch updates from AWS. Please try again later.”）。

  - id: verify_installed
    kind: verify_ui
    description: >
      更新后首页 My Applications 里该应用仍在（.appFullName）。
      未验证：本机没有可用更新，这段没跑到；版本号显示位置也还没核实
    control: ${params.application}
    expect:
      contains: ${params.application}
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: record
    kind: artifact
    name: app-update.json
    content:
      job: ${job.id}
      application: ${params.application}
      expect_version: ${params.expect_version}
      popup: ${steps.verify_popup}
      update: ${steps.update}
