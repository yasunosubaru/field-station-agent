id: gui.app.update
version: 2
title: 更新已安装的非核心应用（Update application，更新前人工闸门）
summary: >
  本版套件没有「给某个应用选一个新 zip」的更新入口：更新由首页顶部横幅发起——
  有更新时按钮写着「New noncore app version available」（另一种文案是
  “Updates are available for N Applications”，按钮 Install / Dismiss），点开是
  Update application 弹窗，正文 “Select the application(s) to update” + 应用卡片，
  选中后才会出现可用的更新按钮。没有可用更新时这些元素根本不在 DOM 里
  （本机实测整页找不到 “Update application” 一个节点，横幅也不可见，仍写着
  “Updates are available for 0 Applications”）。更新源是 AWS（文案
  “Unable to fetch updates from AWS. Please try again later.”），所以打开弹窗这一步
  只能人工完成；本流程停在点 Update 之前。
intent: suite.app.update
risk: high
tags: [suite, application, update, gui, aws]

requires:
  engine: true
  live: false
  gui: true
  node: false

params:
  application:
    type: string
    required: true
    description: 要更新的应用名称（必须已安装；弹窗里卡片的标题就是这个字）
  expect_version:
    type: string
    required: false
    description: 更新后应显示的版本号

approval:
  required: false
  risk: high
  reason: 审批门放在点 Update 之前；打开弹窗与核对卡片只读。

failure:
  screenshot: true
  classes: [environment, input, execution, artifact, capability]

docs:
  - 逆向/03_分析/19_原版GUI覆盖矩阵.md
  - docs/operations/high-risk-actions.md

steps:
  - id: health
    kind: http
    method: GET
    path: /api/health
    expect:
      json:
        ok: true

  - id: open_popup
    kind: human_gate
    risk: medium
    reason: >
      Update application 弹窗只能从首页顶部那张条件性横幅打开：横幅按钮
      「New noncore app version available」在 0 个应用有更新时 display:none
      （DOM 里没有可点的文字），CDP 点不到；更新清单又来自 AWS，本机拿不到。
      所以「打开弹窗」这一步只能人工。
    prompt: |
      请在 My Applications 首页顶部找更新横幅：
        · 有更新时按钮写着「New noncore app version available」，
          或者文案是「Updates are available for N Applications」；
        · 点它打开 Update application 弹窗。
      本机当前没有可用更新（横幅不可见，0 个应用），如果确实没有横幅，
      请选 rejected 并写明「本机无可用更新」——不要假装打开过。
      打开后确认弹窗里出现了 params.application 对应的应用卡片，再选 approved。

  - id: verify_popup
    kind: verify_ui
    description: >
      弹窗正文的真实文案是 “Select the application(s) to update”；
      读不到就说明没有更新弹窗（本机就是这种情况）
    control: Select the application(s) to update
    expect:
      contains: Select the application(s) to update
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: approve_update
    kind: human_gate
    risk: high
    reason: 覆盖安装不可逆；先确认应用名与要装的版本。
    prompt: |
      即将更新应用。应用名与期望版本见本 job 的 params（application / expect_version），
      确认弹窗里选中的就是它、版本正确后再批准。

  - id: update
    kind: gui
    description: 点弹窗右下角的更新按钮（未选中卡片时是禁用态）；target: 按目标点，闸门已在前面
    actions:
      - action: click
        locator: "target:Update"
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        现在点 Update，等进度结束。完成后选 done；失败就选 failed 并写明错误
        （例如 “Unable to fetch updates from AWS. Please try again later.”）。

  - id: verify_installed
    kind: verify_ui
    description: >
      更新后首页 My Applications 里该应用仍在（.appFullName）。
      未验证：本机没有可用更新，这段没跑到；版本号显示位置也还没核实
    control: ${params.application}
    expect:
      contains: ${params.application}
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: record
    kind: artifact
    name: app-update.json
    content:
      job: ${job.id}
      application: ${params.application}
      expect_version: ${params.expect_version}
      popup: ${steps.verify_popup}
      update: ${steps.update}
