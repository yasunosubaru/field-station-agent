id: gui.device.update
version: 2
title: 刷写接收机固件（Update 窗口，人工闸门在 Apply 之前）
summary: >
  本版套件的固件升级不在 Manage 页的设备卡片菜单里——卡片右上「…」（button.more-img，
  纯图标、无文字）只有 Edit Device / Download configuration / Load configuration. /
  Delete Device 四项。真正的 Update 窗口属于「已连接的那台设备」：连上之后在 Device 菜单里
  打开，窗口上是 Current Firmware Version / Current Manage Web Version、Browse、Select File、
  Apply（帮助原文：“Click the Browse button … Click the Apply button. After the new software
  is loaded, the receiver will restart.”）。Browse 弹的是原生 Open 对话框，设备菜单也只有
  连上后才生成，两者都不在 CDP 的文字可选范围内，所以准备段走人工闸门；
  本流程只做到**点 Apply 之前**，绝不代点 Apply。
intent: device.update
risk: high
tags: [device, update, firmware, gui, oem729]

requires:
  engine: true
  live: true
  gui: true
  node: false

params:
  firmware:
    type: path
    required: true
    description: 固件文件（本机路径）。流程只读它、算哈希，不会上传到别处
  model:
    type: string
    required: true
    pattern: '^[A-Za-z0-9.-]+$'
    description: 接收机型号，必须与 VERSION (#37) 的 model 完全一致，例如 OEM729
  expect_software:
    type: string
    required: false
    description: 升级后期望的固件版本（正则），例如 ^7\.10
  target:
    type: string
    required: false
    description: 未连接时用它建会话：COM8@115200 / tcp://host:port
  drop_grace_s:
    type: number
    default: 60
  return_timeout_s:
    type: number
    default: 600
    description: 固件升级可能重启，预算给到 10 分钟
  poll_s:
    type: number
    default: 2.0

approval:
  required: false
  risk: high
  reason: 审批门放在 Apply 之前（见 approve_apply），准备步骤是只读/可撤的。

failure:
  screenshot: true
  classes: [environment, input, execution, artifact, capability]

docs:
  - 逆向/03_分析/18_1比1差距台账.md
  - docs/operations/high-risk-actions.md

steps:
  - id: health
    kind: http
    method: GET
    path: /api/health
    expect:
      json:
        ok: true

  - id: digest
    kind: file_digest
    path: ${params.firmware}
    save_as: firmware
    description: 先把文件哈希钉住，事后能证明刷的是哪一份

  - id: ensure_link
    kind: ensure_live
    target: ${params.target}
    save_as: link
    description: >
      没有会话就先按 target 建一条。本机目前只有 COM3~COM6 四个蓝牙串口
      （/api/ports 实测），没有接收机，这一步会以 environment 失败——那是真实情况，
      不要改成「假装连上」

  - id: request_version
    kind: live_command
    line: LOG VERSION ONCE
    await_reply: false
    save_as: version_request

  - id: read_version
    kind: await_receiver
    wait_for: version
    timeout_s: 20
    save_as: before
    description: 升级前必须读到型号；读不到就不让往下走

  - id: assert_model
    kind: assert
    description: 型号不符立即停——刷错机型的固件是不可逆事故
    checks:
      - path: steps.read_version.model
        equals: ${params.model}

  - id: open_update
    kind: human_gate
    risk: medium
    reason: >
      Update 窗口只在「已连接的那台设备」里存在：设备卡片菜单是纯图标（more-img），
      连上后出现的 Device 菜单是动态生成的，Browse 还会弹原生 Open 对话框——
      这三处 CDP 都点不到，只能人工做。做完再批准往下。
    prompt: |
      请在原版套件里完成（CDP 到不了这一步，原因是控件无文字/原生对话框）：
        1. Manage 页，把 params.model 指定的那台接收机的 Connect 开关打开；
        2. 在该设备的 Device 菜单里点 Update；
        3. 点 Browse，在原生 Open 对话框里选 params.firmware 指定的固件文件；
        4. 确认窗口上 Select File 一行显示的就是这个文件名，
           Current Firmware Version 与机型对得上。
      具体路径与型号见本 job 的 params（firmware / model）。
      现在**不要**点 Apply。做完选 approved。

  - id: confirm_file
    kind: verify_ui
    description: >
      Update 窗口里的 Select File 一行必须显示固件文件名。这是人工填完之后由 CDP 回读的；
      没走到这一步（没有接收机 / 没连上）就会读不到而停下
    control: Select File
    expect:
      contains: ${steps.digest.name}
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: approve_apply
    kind: human_gate
    risk: high
    reason: 固件升级不可逆；失败可能变砖，回滚依赖现场。
    prompt: |
      即将点击 Update 窗口的 Apply 刷写 params.model 指定的机型，
      固件为 params.firmware。
      文件 SHA256 见本 job 的 digest 步骤输出（`workflow status <job_id>` 里的 steps）。
      确认型号、文件、校验和都无误后再批准。

  - id: before_apply
    kind: mark_cursor
    save_as: mark
    description: 只认 Apply 之后到达的 VERSION

  - id: apply
    kind: gui
    description: 真正点 Apply（人工闸门已过）
    actions:
      - action: click
        locator: Apply
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        现在点击 Update 窗口的 Apply，并等进度条结束。
        升级过程中不要断电、不要拔线。完成后选 done。

  - id: after
    kind: await_receiver
    wait_for: reconnect_and_version
    reconnect: true
    model: ${params.model}
    software: ${params.expect_software}
    after_cursor: ${steps.mark.cursor}
    drop_grace_s: ${params.drop_grace_s}
    timeout_s: ${params.return_timeout_s}
    poll_s: ${params.poll_s}
    send_after_reconnect: LOG VERSION ONCE
    save_as: after
    description: 升级后重启并等待 VERSION；超时就停，不自动重刷

  - id: check_software
    kind: assert
    description: 只有给了 expect_software 才断言；没给就跳过并记在结果里
    checks:
      - path: steps.after.software
        matches: ${params.expect_software}

  - id: record
    kind: artifact
    name: update.json
    content:
      job: ${job.id}
      model: ${params.model}
      firmware: ${steps.firmware}
      before: ${steps.read_version}
      after: ${steps.after}
      expect_software: ${params.expect_software}
      apply: ${steps.apply}
