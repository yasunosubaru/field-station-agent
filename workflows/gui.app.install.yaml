id: gui.app.install
version: 2
title: 从本地 ZIP 导入并添加应用（Add application，安装前人工闸门）
summary: >
  My Applications 页的「Add application」打开的是弹窗 #popupModal.appInstallerPopup：
  标题 Add application，正文是「可安装应用」列表——本机没有候选时显示
  “No applications are available for installation.”，有候选时是
  “Select the application(s) to add” + 应用卡片；底栏是
  “Import from your computer / Cancel / Add”。本地 .zip 只能走 Import from your computer，
  而它调的是原生 Open 对话框（套件代码 remote.dialog.showOpenDialog，filters 只留 ZIP），
  CDP 里没有页面可点，所以这一步只能人工；导入后卡片出现在 .app-card-container，
  选中才会点亮 Add（未选中时 Add 带 customDisableAddBtn）。
intent: suite.app.install
risk: high
tags: [suite, application, install, gui, package, zip]

requires:
  engine: true
  live: false
  gui: true
  node: false

params:
  package:
    type: path
    required: true
    description: 应用安装包（.zip）；流程只读它并算哈希
  expect_name:
    type: string
    required: true
    description: 安装后应出现在 My Applications 里的应用名（同时是弹窗里卡片的名字）
  expect_version:
    type: string
    required: false
    description: 可选：期望版本（应用卡片上显示）

approval:
  required: false
  risk: high
  reason: 审批门放在点 Add 之前；前面的打开对话框、校验包哈希只读。

failure:
  screenshot: true
  classes: [environment, input, execution, artifact, capability]

docs:
  - 逆向/03_分析/19_原版GUI覆盖矩阵.md
  - docs/operations/high-risk-actions.md

steps:
  - id: health
    kind: http
    method: GET
    path: /api/health
    expect:
      json:
        ok: true

  - id: settle_home
    kind: wait_ui
    control: Add application
    expect:
      contains: Add application
    timeout: 12
    description: >
      首页会异步枚举非核心应用，期间卡片区显示“Loading”且按钮会被重绘；
      这期间点 Add application 会被吞掉（本机实测）。
      **原来是 `kind: sleep / seconds: 2.0` 的裸等**（RPA-1 的 lint 会报它），
      改成条件等待：轮询 `Add application` 是否已可读，读到就继续，最多等 12 秒。
      刚启动的机器首页要约 9 秒才绑定点击（实测 9.2s），故超时取 12。

  - id: digest
    kind: file_digest
    path: ${params.package}
    save_as: package
    description: 先钉住安装包哈希，事后能证明装的是哪一份

  - id: open_add
    kind: gui
    description: >
      首页 My Applications ▸ 「+ Add application」。注意这个流程必须从首页开始——
      左上角的返回首页入口是纯图标（a#menu-home-banner，无文字/title/aria），
      CDP 只能按文字找元素，从 Manage 页回不到首页
    actions:
      - action: click
        locator: Add application
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        请在 My Applications 首页点「+ Add application」，等弹窗出来。
        现在**不要**点 Add。完成后选 done。

  - id: wait_dialog
    kind: wait_ui
    control: Import from your computer
    expect:
      contains: Import from your computer
    timeout: 12
    description: >
      弹窗打开前套件会去拉一次「可安装应用」清单：冷启动实测 3.1 秒才 display:block，
      清单有缓存时 0.3 秒。原来固定睡 5 秒——慢机器上不够、快机器上白等；
      改成轮询读「Import from your computer」，出现就继续，12 秒还没出现才算失败

  - id: verify_modal
    kind: verify_ui
    description: >
      弹窗底栏只有这个弹窗才有「Import from your computer」；读到它就说明
      Add application 弹窗真的开着（关掉后元素还在 DOM 里，但尺寸为 0，读不到）
    control: Import from your computer
    expect:
      contains: Import from your computer
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: import_manual
    kind: human_gate
    risk: medium
    reason: >
      「Import from your computer」打开的是 Windows 原生 Open 对话框（套件代码里是
      remote.dialog.showOpenDialog，title 'Open'，filters: ZIP Files），不是网页元素，
      CDP 点不到也填不了；只能人工选文件。
    prompt: |
      请在 Add application 弹窗里点「Import from your computer」，
      在原生 Open 对话框里选择 params.package 指定的那个 .zip 安装包
      （文件名与 SHA256 见本 job 的 digest 步骤输出）。
      导入成功后弹窗里会出现应用卡片，标题是 params.expect_name。
      现在**不要**点 Add。做完选 approved。

  - id: verify_imported
    kind: verify_ui
    description: >
      导入成功后弹窗里出现以应用名为标题的卡片（.appAddCard）。未验证：
      本机没有可导入的候选包，这一段没跑到；有真实 ZIP 时这里才会被读到
    control: ${params.expect_name}
    expect:
      contains: ${params.expect_name}
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: approve_install
    kind: human_gate
    risk: high
    reason: 点 Add 会把应用写进套件目录；先确认应用名、包文件与来源。
    prompt: |
      即将点 Add 添加应用 params.expect_name。
      安装包为 params.package，SHA256 见本 job 的 digest 步骤输出；
      期望版本 params.expect_version。
      确认来源可信后再批准。

  - id: install
    kind: gui
    description: 点弹窗右下角的 Add（未选中任何卡片时它是禁用态，文字仍是 Add）
    actions:
      - action: click
        locator: Add
    screenshot: true
    assisted:
      enabled: true
      prompt: |
        现在点 Add，等安装结束。完成后选 done；失败就选 failed 并写明错误。

  - id: verify_installed
    kind: verify_ui
    description: 安装后首页 My Applications 出现该应用卡片（.appFullName）
    control: ${params.expect_name}
    expect:
      contains: ${params.expect_name}
    assisted:
      enabled: false
      prompt: 这一步必须由驱动真读到值；没有驱动就失败，不接受人工口头确认。

  - id: record
    kind: artifact
    name: app-install.json
    content:
      job: ${job.id}
      application: ${params.expect_name}
      package: ${steps.digest}
      expect_version: ${params.expect_version}
      modal: ${steps.verify_modal}
      install: ${steps.install}
