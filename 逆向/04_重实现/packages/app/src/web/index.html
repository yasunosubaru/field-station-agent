<div class="tabs-view-data">

<!-- My Applications: the suite's landing page (view/html/welcome.html). Cards open the five
     core tools; Manage and GRIT Monitor carry the live-connection count, as the original does. -->

<div class="nas-body">
  <div id="gritGroupView" class="gritSideNav">
    <div class="folders_content">
      <ul class="folders_list">
        <li class="add_folder-btn">
          <div class="add_network add_folder" title="分组（重实现未使用）">
            <img src="/assets/images/add_circle_blue.svg" alt="">
          </div>
          <p class="elidedText add-group">Add group</p>
        </li>
        <li class="all-folder-selected active-folder">
          <div class="folder-all folder_device" title="全部抓包">
            <img src="/assets/images/folder_blue.svg" alt="">
            <span class="folder_text elidedText">All</span>
          </div>

    </div>
  </div>

  <main class="nas-content">
    <div class="folder-detail-heading">
      <span class="device-text" id="page-title">Convert</span>
    </div>
    <p class="receiver-count" id="page-subtitle">把抓包转成 ASCII / BINARY / KML，产物只留在内存</p>

    <div class="nas-panels">
      <div id="panel-convert" class="app-panel" role="tabpanel" aria-labelledby="tab-convert" hidden></div>
      <div id="panel-manage" class="app-panel" role="tabpanel" aria-labelledby="tab-manage"></div>
      <div id="panel-playback" class="app-panel" role="tabpanel" aria-labelledby="tab-playback" hidden></div>
      <div id="panel-grit" class="app-panel" role="tabpanel" aria-labelledby="tab-grit" hidden></div>

      <!-- Graph 页由 panels/graph.js 挂载（首页 + 工作区两个视图，见该文件头注释） -->
      <div id="panel-graph" class="app-panel" role="tabpanel" aria-labelledby="tab-graph" hidden></div>

      <!-- Workflows 页由 panels/workflows.js 挂载：A−B 缺口流程的目录 / 运行 / 审批 / 证据 -->
      <div id="panel-workflows" class="app-panel" role="tabpanel" aria-labelledby="tab-workflows" hidden></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function bytesText(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }

  /* ---------------- 页面定义 ---------------- */

  var PAGES = {
    convert: {
      title: 'Convert',
      subtitle: '把抓包转成 ASCII / BINARY / KML，产物只留在内存',
      icon: 'convert-default-icon'
    },
    manage: {
      title: 'Manage',
      subtitle: '按报文类型聚合，点开一行看逐帧解析字段',
      icon: 'default-icon'
    },
    playback: {
      title: 'Playback',
      subtitle: '载入时间轴、播放，按时间裁切导出原始 SBF',
      icon: 'pl-default-icon'
    },
    graph: {
      title: 'Graph',
      subtitle: '把 Graph 导出的 CSV 画成折线',
      icon: 'default-icon'
    },
    grit: {
      title: 'GRIT Monitor',
      subtitle: '频谱 / 干扰 / 信号矩阵监控',
      icon: 'grit-default-icon'
    },
    workflows: {
      title: 'Workflows',
      subtitle: '原版 GUI 缺口流程：状态机、审批门、证据',
      icon: 'default-icon'
    }
  };
  var ORDER = ['convert', 'manage', 'playback', 'grit', 'graph', 'workflows'];

  var panelEls = {
    convert: $('panel-convert'),
    manage: $('panel-manage'),
    playback: $('panel-playback'),
    grit: $('panel-grit'),
    graph: $('panel-graph'),
    workflows: $('panel-workflows')
  };

  /* ---------------- 抓包选择器（ctx.capture 的唯一来源） ---------------- */

  var captures = [];
  var captureListeners = [];

  function currentCapture() {
    var select = $('capture-select');
    return select ? select.value || '' : '';
  }

  function fireCaptureChange() {
    var value = currentCapture();
    for (var i = 0; i < captureListeners.length; i++) {
      try {
        captureListeners[i](value);
      } catch (error) {
        console.error('[shell] onCaptureChange 回调抛错：', error);
      }
    }
  }

  /* ---------------- 与 /api 对话 ---------------- */

  function apiUrl(path, params) {
    // 面板模块传过来的路径已经带 /api 前缀（契约见 11_UI壳.md），也兼容只写 /captures 的写法
    var url = path.indexOf('/api/') === 0 ? path : '/api' + path;
    var pairs = [];
    if (params) {
      for (var key in params) {
        if (!Object.prototype.hasOwnProperty.call(params, key)) continue;
        if (params[key] === undefined || params[key] === null) continue;
        pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
      }
    }
    if (!pairs.length) return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + pairs.join('&');
  }

  function request(method, path, body, params) {
    var init = { method: method, headers: { Accept: 'application/json' } };
    if (body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(body);
    }
    return fetch(apiUrl(path, params), init).then(function (response) {
      var type = response.headers.get('content-type') || '';
      var parse = type.indexOf('application/json') >= 0
        ? response.json()
        : response.text().then(function (text) { return { error: text }; });
      return parse.then(function (data) {
        if (!response.ok) throw new Error((data && data.error) || ('HTTP ' + response.status));
        return data;
      });
    });
  }

  /* panels/*.js 拿到的 ctx —— 契约见 逆向/03_分析/11_UI壳.md */
  var ctx = {
    api: {
      get: function (path, params) { return request('GET', path, undefined, params); },
      post: function (path, body) { return request('POST', path, body); }
    },
    get capture() { return currentCapture(); },
    getCapture: currentCapture,
    onCaptureChange: function (callback) {
      if (typeof callback !== 'function') return function () {};
      captureListeners.push(callback);
      return function () {
        var index = captureListeners.indexOf(callback);
        if (index >= 0) captureListeners.splice(index, 1);
      };
    }
  };

  /* ---------------- 面板挂载 ---------------- */

  var panelState = {};

  function showPanelState(el, title, text, retryName) {
    el.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'panel-state';
    var head = document.createElement('span');
    head.className = 'panel-state-title';
    head.textContent = title;
    box.appendChild(head);
    if (text) {
      var line = document.createElement('span');
      line.className = 'panel-state-text';
      line.textContent = text;
      box.appendChild(line);
    }
    if (retryName) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn';
      button.textContent = '重试';
      button.addEventListener('click', function () { mountPanel(retryName, true); });
      box.appendChild(button);
    }
    el.appendChild(box);
  }

  function mountPanel(name, bustCache) {
    var el = panelEls[name];
    if (!el) return;
    panelState[name] = 'loading';
    showPanelState(el, '载入面板…', './panels/' + name + '.js');
    // 失败过的模块会被浏览器的模块表缓存，重试时加时间戳绕开
    var specifier = './panels/' + name + '.js' + (bustCache ? '?v=' + Date.now() : '');
    import(specifier).then(function (module) {
      if (!module || typeof module.mount !== 'function') {
        throw new Error('模块没有导出 mount(root, ctx)');
      }
      el.innerHTML = '';
      module.mount(el, ctx);
      panelState[name] = 'ok';
    }).catch(function (error) {
      panelState[name] = 'failed';
      showPanelState(
        el,
        '面板不可用',
        './panels/' + name + '.js 没能载入：' + ((error && error.message) || String(error)),
        name
      );
    });
  }

  function ensurePanel(name) {
    if (!panelEls[name]) return;
    if (panelState[name] === 'ok' || panelState[name] === 'loading') return;
    mountPanel(name, false);
  }

  /* ---------------- 页签 ---------------- */

  var currentPage = 'manage';

  /* Landing page vs. a tool. `home` is not a tab: the original's welcome screen has neither the
   * tab strip nor the folder rail, so both are hidden while it is up. */
  function showHome() {
    currentPage = 'home';
    document.body.setAttribute('data-page', 'home');
    for (var i = 0; i < ORDER.length; i++) {
      var panel = panelEls[ORDER[i]];
      if (panel) panel.hidden = true;
    }
    var tabsWrap = document.querySelector('.tabs-view-data');
    var bodyWrap = document.querySelector('.nas-body');
    if (tabsWrap) tabsWrap.hidden = true;
    if (bodyWrap) bodyWrap.hidden = true;
    var view = $('home-view');
    if (view) view.hidden = false;
    refreshHomeConnections();
  }

  function selectPage(name) {
    if (name === 'home') { showHome(); return; }
    if (!PAGES[name]) return;
    currentPage = name;
    document.body.setAttribute('data-page', name);

    var view = $('home-view');
    if (view) view.hidden = true;
    var tabsWrap = document.querySelector('.tabs-view-data');
    var bodyWrap = document.querySelector('.nas-body');
    if (tabsWrap) tabsWrap.hidden = false;
    if (bodyWrap) bodyWrap.hidden = false;

    var tabs = document.querySelectorAll('#tabs-list li.app-tab');
    for (var i = 0; i < tabs.length; i++) {
      var selected = tabs[i].getAttribute('data-tab') === name;
      if (selected) tabs[i].classList.add('ui-tabs-active');
      else tabs[i].classList.remove('ui-tabs-active');
      tabs[i].setAttribute('aria-selected', selected ? 'true' : 'false');
    }

    for (var j = 0; j < ORDER.length; j++) {
      var el = panelEls[ORDER[j]];
      if (el) el.hidden = ORDER[j] !== name;
    }

    $('page-title').textContent = PAGES[name].title;
    $('page-subtitle').textContent = PAGES[name].subtitle;

    ensurePanel(name);
  }

  function wireTabs() {
    var tabs = document.querySelectorAll('#tabs-list li.app-tab, #app-menu [data-tab]');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function (event) {
        event.preventDefault();
        closeMenu();
        selectPage(this.getAttribute('data-tab'));
      });
    }
  }

  /* ---------------- 顶栏下拉 ---------------- */

  /* ---------------- My Applications ---------------- */

  function paintConnections(active) {
    var nodes = document.querySelectorAll('[data-home-connections]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = active + ' Active Connection' + (active === 1 ? '' : 's');
    }
  }

  var homeTimer = 0;

  function refreshHomeConnections() {
    request('GET', '/live/status').then(function (data) {
      paintConnections(data && data.connected ? 1 : 0);
    }).catch(function () {});
    if (homeTimer) return;
    homeTimer = setInterval(function () {
      if (currentPage !== 'home') return;
      request('GET', '/live/status').then(function (data) {
        paintConnections(data && data.connected ? 1 : 0);
      }).catch(function () {});
    }, 5000);
  }

  function wireHome() {
    var cards = document.querySelectorAll('[data-home-tab]');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function (event) {
        event.preventDefault();
        selectPage(this.getAttribute('data-home-tab'));
      });
    }
    var add = $('home-add-app');
    if (add) {
      add.addEventListener('click', function () {
        var note = $('home-add-note');
        if (!note) return;
        note.hidden = !note.hidden;
        note.textContent = 'This build ships the five core applications (Manage, Playback, Convert, '
          + 'GRIT Monitor, Graph). The original installs additional packages from NovAtel here; '
          + 'this reimplementation has no package store, so there is nothing to add.';
      });
    }
  }

  function closeMenu() {
    var menu = $('app-menu');
    var banner = $('menu-home-banner');
    if (menu) menu.classList.remove('show');
    if (banner) banner.setAttribute('aria-expanded', 'false');
  }

  function wireBanner() {
    var menu = $('app-menu');
    var banner = $('menu-home-banner');
    if (banner) {
      banner.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        var open = menu.classList.toggle('show');
        banner.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      banner.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          banner.click();
        }
      });
    }
    document.addEventListener('click', function (event) {
      if (!menu || !menu.classList.contains('show')) return;
      if (menu.contains(event.target) || (banner && banner.contains(event.target))) return;
      closeMenu();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeMenu();
    });
    var home = $('nas-home-menu');
    if (home) {
      home.addEventListener('click', function (event) {
        event.preventDefault();
        closeMenu();
        showHome();
      });
    }
  }

  /* ---------------- 启动 ---------------- */

  function fillCaptures() {
    var select = $('capture-select');
    if (!select) return;
    if (!captures.length) {
      select.innerHTML = '<option value="">（samples 下没有找到抓包）</option>';
      return;
    }
    select.innerHTML = captures.map(function (item) {
      var dir = item.path.indexOf('/') >= 0 ? item.path.slice(0, item.path.lastIndexOf('/')) : '.';
      return '<option value="' + esc(item.path) + '">'
        + esc(item.name + '  ·  ' + dir + '  ·  ' + bytesText(item.bytes)) + '</option>';
    }).join('');
    var preferred = captures.filter(function (item) { return item.path === 'convert/clean-9600.gps'; })[0]
      || captures.filter(function (item) { return item.name === 'clean-9600.gps'; })[0]
      || captures[0];
    if (preferred) select.value = preferred.path;
  }

  function wireCapture() {
    var select = $('capture-select');
    if (select) select.addEventListener('change', fireCaptureChange);
  }

  function bootHealth() {
    var text = $('health-text');
    request('GET', '/health').then(function (data) {
      text.className = 'nas-health ok';
      text.textContent = '本地服务正常 · v' + data.version + ' · ' + data.formats.length + ' 种输出格式';
    }).catch(function () {
      text.className = 'nas-health bad';
      text.textContent = '无法连接本地服务';
    });
  }

  function bootCaptures() {
    request('GET', '/captures').then(function (data) {
      captures = data.captures || [];
      fillCaptures();
    }).catch(function (error) {
      var select = $('capture-select');
      if (select) select.innerHTML = '<option value="">（抓包列表读取失败）</option>';
      console.error('[shell] 抓包列表读取失败：', error);
    });
  }

  wireBanner();
  wireTabs();
  wireCapture();
  wireHome();
  bootHealth();
  bootCaptures();
  /* The original opens on its welcome page, not on a tool. */
  selectPage('home');
})();
</script>
<script type="module" src="/theme.js"></script>
</body>
</html>
