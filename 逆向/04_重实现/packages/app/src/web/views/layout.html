<!doctype html>
<!--
  五个块共用的外壳页 —— 视-0「一个窗口换内容」。

  ## 与改前的差别

  改前是「外壳 + 四 iframe」：中栏一个 <iframe>，四个视角各自挂一个现成页面。
  改后中栏是 <div data-main>，同一个文档里换内容。理由（25.5.1）：

  | iframe | 同一文档换内容 |
  |---|---|
  | 四个独立文档 | 一个文档 |
  | 四份状态 | 一份状态 |
  | 四次加载 | 一次加载 |
  | postMessage 通信 | 直接函数调用 |

  ## 五块各一份

  顶栏 / 左导航 / 主内容 / 右栏 / 底栏，全局各一份。切视角时只有主内容与右栏换，
  其余三块不动 —— 台站、模型、运行时始终在同一个位置，不用每个视角重新找。

  ## 服务端只替换四个占位

    {{VIEW_ID}}       body[data-view]，左导航高亮与 CSS 的依据
    {{VIEW_TITLE}}    <title> 与主内容页头的名字
    {{VIEW_CONTENT}}  主内容画哪一块（data-content）
    {{NAV_ITEMS}}     左导航四个链接（服务端渲染：JS 挂了导航仍然可用）

  ## 为什么颜色一行都没写

  全部取 agent.css 已有的 token（--bg / --panel / --border / --text / --muted /
  --accent / --ok / --warn / --bad / --radius）。视觉规矩三条（数字等宽、单位小一号、
  表格只画横线）落在 views.css 的 .num / .unit / table.clean 上。
-->
<html lang="zh-CN" data-density="comfort">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{VIEW_TITLE}}</title>
<link rel="stylesheet" href="/agent.css">
<link rel="stylesheet" href="/views/views.css">
<link rel="stylesheet" href="/views/blocks.css">
</head>
<body data-view="{{VIEW_ID}}" data-mode="agent" data-agent-theme="dark" data-rail-state="expanded">

<a class="vw-skip" href="#vw-main">跳到内容</a>

<div class="vw-shell" data-shell>

  <!-- ① 顶栏：必须是五样（应用名+版本 / 台站 / 模型 / 运行时 / 连接）。 -->
  <header class="vw-top" data-top>
    <div class="vw-top-brand">
      <span class="vw-top-mark" aria-hidden="true">FSA</span>
      <span class="vw-top-name">野外台站智能体</span>
      <span class="vw-top-version" data-info-version>v—</span>
    </div>

    <div class="vw-top-info">
      <label class="vw-top-field">
        <span class="vw-top-label">台站</span>
        <!-- 「最近使用」在最上面（25.3.3）：90% 的操作针对最近那一两个台站。 -->
        <select class="vw-top-picker" data-station-picker aria-label="当前台站">
          <option value="">未选择</option>
        </select>
      </label>
      <span class="vw-top-field">
        <span class="vw-top-label">模型</span>
        <span class="vw-top-value" data-info-model>—</span>
      </span>
      <span class="vw-top-field">
        <span class="vw-top-label">运行时</span>
        <span class="vw-top-value" data-info-runtime>—</span>
      </span>
      <span class="vw-top-field">
        <span class="vw-top-label">连接</span>
        <span class="vw-top-value vw-top-conn" data-info-connection data-connection="unknown">—</span>
      </span>
    </div>

    <div class="vw-top-actions">
      <!-- 密度两档：只改行高与字号，不重排数据（25.13.3）。 -->
      <button class="vw-btn vw-btn-quiet" type="button" data-density-toggle aria-pressed="false">舒适</button>
      <!--
        右栏两个入口，按宽度自动二选一（25.6.2 / 附录 C.8）：
          · 宽屏：直接收/展右栏（它是布局的一部分）；
          · < 1280：右栏改成抽屉，这个按钮变成「详情」，点开覆盖在主内容上。
        抽屉**不挤压主内容** —— 挤压会重排，等于把用户的视线位置打乱。
      -->
      <button class="vw-btn vw-btn-quiet vw-rail-inline" type="button" data-rail-toggle aria-expanded="true" aria-label="右栏">右栏</button>
      <button class="vw-btn vw-btn-quiet vw-rail-drawer" type="button" data-rail-drawer-open aria-expanded="false" aria-controls="vw-rail" aria-label="详情">详情</button>
    </div>
  </header>

  <!-- ② 左导航：图标 + 一行小字。断点自动折叠，不做手动折叠（25.4.4）。 -->
  <nav class="vw-nav" data-nav aria-label="视角">
    {{NAV_ITEMS}}
  </nav>

  <!-- ③④ 主内容 + 右栏：只有这两块跟着视角变。 -->
  <div class="vw-body">
    <main class="vw-main" id="vw-main" data-main data-content="{{VIEW_CONTENT}}" tabindex="-1">
      <header class="vw-view-head" data-view-head>
        <h1 class="vw-view-title">{{VIEW_TITLE}}</h1>
      </header>
    </main>

    <aside class="vw-rail" id="vw-rail" data-rail aria-label="详情">
      <!-- 视角挂载后由 shell.js 的 renderRail 填；空着时给一句，不让用户以为这栏坏了。 -->
      <p class="vw-rail-empty">还没有可显示的内容。</p>
    </aside>
  </div>

  <!-- ⑤ 底栏：四个状态灯 + 连接与用量。全局状态，与看哪个视角无关（25.7.2）。 -->
  <footer class="vw-foot" data-foot aria-label="状态"></footer>

</div>

<script type="module" src="/views/shell.js"></script>

</body>
</html>
